<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font family</title>
     <style>

        .p1 {
            font-family: Arial;
        }

        .p2 {
            font-family: "Times New Roman";
        }

        .p3 {
            font-family: Verdana;
        }

    </style>
</head>
<body>
    <h2>Different Font Families</h2>

    <p class="p1">This paragraph uses Arial font.</p>

    <p class="p2">This paragraph uses Times New Roman font.</p>

    <p class="p3">This paragraph uses Verdana font.</p>
    
</body>
</html>
