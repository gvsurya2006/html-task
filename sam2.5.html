<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHILD SELECTOR</title>
    <style>
        div > p {
            color:green;
        }
    </style>
</head>
<body>
    <div>
        <p>this is first paragraph</p>
        <p>this is second paragraph</p>
        <selection>
            <p>this is third paragraph</p>
        </selection>
    </div>
    
    
</body>
</html>
