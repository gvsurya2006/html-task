<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css text properties</title>
     <style>

        .transform {
            text-transform: uppercase;
        }

        .decoration {
            text-decoration: underline;
        }

        .spacing {
            letter-spacing: 5px;
        }

    </style>
</head>
<body> <h2>CSS Text Properties</h2>

    <p class="transform">
        this text uses text transform.
    </p>

    <p class="decoration">
        This text uses text decoration.
    </p>

    <p class="spacing">
        This text uses letter spacing.
    </p>
    
</body>
</html>
