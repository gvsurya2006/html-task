<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css font properties</title>
     <style>

        .size {
            font-size: 25px;
        }

        .weight {
            font-weight: bold;
        }

        .style {
            font-style: italic;
        }

    </style>
</head>
<body>
     <h2>CSS Font Properties</h2>

    <p class="size">This paragraph demonstrates font-size.</p>

    <p class="weight">This paragraph demonstrates font-weight.</p>

    <p class="style">This paragraph demonstrates font-style.</p>

    
</body>
</html>
